# Copy this file to config.toml and edit it. config.toml is git-ignored because it holds your keys.

[timetable]
# Your timetable: a weekly .csv (see timetable.example.csv) or a .ics calendar export.
path = "timetable.csv"
# Wake up this many minutes before your first class of the day (7:30 class -> 6:45 alarm).
lead_minutes = 45
# Optional: no alarms outside the semester.
# term_start = 2026-08-24
# term_end = 2026-12-11
# Optional: holidays and days off.
skip_dates = []
# Optional: classes whose name contains any of these words never trigger an alarm.
ignore_keywords = ["office hours"]

[shampoo]
# Shampoo days get an earlier alarm (7:30 class -> 6:15 with 75 minutes).
# Weekly shampoo days, e.g. ["Mon", "Thu"]. One-off days: `class-alarm shampoo tomorrow`
# or the "Shampoo" shortcut on your phone.
days = []
lead_minutes = 75

[alarm]
snooze_minutes = 5
max_snoozes = 2
# Stop ringing after this many minutes (snoozes add to it).
ring_limit_minutes = 30
# true: you must type a random 4 digit code shown on screen to stop the alarm (harder to do half asleep).
dismiss_code = true
# Optional custom sound. WAV works on every OS. Leave empty for the built-in beep.
sound_file = ""
# true: ask the OS to wake the laptop from sleep 2 minutes before each alarm. See README "Waking from sleep".
os_wake = false

[phone]
# How often ntfy re-alerts your phone while the alarm is ringing.
repeat_seconds = 60

# Free. Install the ntfy app, subscribe to the same topic. Best on Android.
[phone.ntfy]
enabled = true
server = "https://ntfy.sh"
# Anyone who knows the topic can read it, so make it long and random.
topic = "replace-with-a-long-random-topic-name"
# Only needed for a self-hosted or protected server.
token = ""

# One time purchase app. Emergency alerts repeat until acknowledged and can bypass silent mode.
# Best choice for iPhone.
[phone.pushover]
enabled = false
app_token = ""
user_key = ""
sound = "persistent"
retry_seconds = 30

# Free. Sets your phone's OWN alarm clock every night (rings through silent mode and Do Not Disturb).
# The laptop publishes the next wake time (within 24h) to this topic; a phone shortcut reads it and
# creates the alarm. See README "Phone's own alarm". Use a different topic from the others.
[phone.native_alarm]
enabled = false
server = "https://ntfy.sh"
topic = "replace-with-a-third-long-random-topic"
token = ""

# Real phone call that reads your wake-up message. Costs a few cents per call.
[phone.twilio]
enabled = false
account_sid = ""
auth_token = ""
from_number = "+15550001111"
to_number = "+15552223333"
call_every_minutes = 3

# Phone behavior tracking. Your phone reports what it's doing (app opened, charger plugged in,
# Sleep Focus on) to a second private ntfy topic using iOS Shortcuts automations. Used to learn
# when you usually fall asleep and to tell if you went back to sleep after the alarm.
# See README "Phone behavior setup". You do NOT subscribe to this topic in the ntfy app.
[behavior]
enabled = false
server = "https://ntfy.sh"
events_topic = "replace-with-a-different-long-random-topic"
token = ""

# Bedtime reminders on your phone, based on tomorrow's alarm and your learned sleep pattern.
[sleep]
enabled = false
sleep_hours = 7.5
# Time you usually need to fall asleep once in bed.
fall_asleep_minutes = 15
# "Start winding down" reminder this many minutes before bedtime.
wind_down_minutes = 30
# After bedtime, if your phone is still being used, remind you again every this many minutes.
nag_minutes = 30
max_nags = 4

# After you turn the alarm off: ask your phone "are you awake?". If you don't answer, and the phone
# shows no activity, the laptop and phone ring again.
[awake_check]
enabled = false
check_after_minutes = 5
confirm_window_minutes = 5
# How many times it can ring again before giving up.
max_rerings = 2

# Phone app: the laptop serves a small web app you open on your phone over the same Wi-Fi and add
# to your Home Screen. Next alarm, shampoo days, "I'm awake", sleep, timetable editor.
# `class-alarm run` prints the private link. Only use it on a Wi-Fi you trust.
[web]
enabled = false
host = "0.0.0.0"
port = 8765

[storage]
# Where learned data (phone events, shampoo days) is kept, relative to this file.
dir = "data"
