[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "class-alarm"
version = "0.1.0"
description = "Wakes you before your first class, on your laptop and your phone."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ics = ["icalendar>=5", "recurring-ical-events>=2"]
dev = ["pytest>=7", "icalendar>=5", "recurring-ical-events>=2"]

[project.scripts]
class-alarm = "class_alarm.cli:main"

[tool.setuptools]
packages = ["class_alarm"]
